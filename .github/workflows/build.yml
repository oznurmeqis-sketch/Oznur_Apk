name: Build base.apk

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename to base.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk base.apk

      - name: Upload base.apk
        uses: actions/upload-artifact@v4
        with:
          name: ELENI-91-base-apk
          path: base.apk
          retention-days: 7
